# Continuous integration for the CreateAccess Cesium template.
#
# Runs on every push and every pull request.

name: Verify

on:
  push:
    branches: ["**"]
  pull_request:

# If someone pushes twice quickly, cancel the older run rather than paying for
# both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # CesiumJS 1.141+ requires Node 22 or newer.
          node-version: "22"
          # Caches ~/.npm keyed on package-lock.json, which makes `npm ci`
          # substantially faster on repeat runs.
          cache: "npm"

      - name: Install dependencies
        # `npm ci` installs exactly what package-lock.json specifies and fails
        # if the lockfile and package.json disagree. `npm install` would
        # silently update things, which defeats the point of pinning.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # This also type-checks: the build script runs `tsc --noEmit` first.
        run: npm run build

      - name: Check the Cesium static assets were copied
        # The most valuable four lines in this file. If vite-plugin-cesium
        # stops working against a new Vite version, the build still succeeds
        # and the site is silently broken. This catches that directly.
        run: |
          test -d dist/cesium/Workers || (echo "::error::dist/cesium/Workers is missing — vite-plugin-cesium did not copy Cesium's static assets. The deployed site would show a blank globe." && exit 1)
          test -f dist/cesium/Cesium.js || (echo "::error::dist/cesium/Cesium.js is missing." && exit 1)
          echo "Cesium assets present: $(du -sh dist/cesium | cut -f1)"

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        # No VITE_CESIUM_ION_TOKEN is set here, on purpose.
        #
        # CI has no token and anyone using this template will not have one
        # either. The app falls back to OpenStreetMap imagery in that case, so
        # the test verifies the path a brand new user actually experiences.
        run: npm test

      - name: Upload test artifacts
        # `always()` so the screenshots and traces survive a failing run, which
        # is exactly when they are wanted.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
